; ---------------------------------------------------------------------------
;  TradeAI supervisord configuration  (Phase A-2)
;
;  Linux-only. Install:    sudo apt install supervisor
;                          (or: pip install supervisor && supervisord -c ...)
;
;  Place this file at:     /etc/supervisor/conf.d/tradeai.conf
;                          (or run a personal supervisord pointing at it directly)
;
;  Then:                   sudo supervisorctl reread
;                          sudo supervisorctl update
;                          sudo supervisorctl start tradeai_bot tradeai_watchdog
;
;  Required env vars (set in /etc/default/tradeai or via [program] environment):
;      TELEGRAM_TOKEN, CHAT_ID
;      EXECUTION_MODE             (PAPER or LIVE; PAPER unless explicitly switching)
;      LIVE_MODE_CONFIRMED=YES    (required ONLY when EXECUTION_MODE=LIVE)
;      YOUR_CAPITAL               (required when LIVE)
;      SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_TO   (optional secondary channel)
;
;  Crash semantics:
;      autorestart=true + startretries=999 means supervisord will restart the
;      bot indefinitely. Combined with state_store.py + the bot_state DB table,
;      a restart resumes the cycle counter, cooldowns, OGD weights, and open
;      signals exactly where the previous run left off. PidFile prevents the
;      restart from racing the previous PID still cleaning up.
; ---------------------------------------------------------------------------

[program:tradeai_bot]
command=/usr/bin/env python3 -u crypto_alert.py
directory=/opt/tradeai
autostart=true
autorestart=true
; Restart immediately for crashes; back off on rapid restart loops.
startsecs=10
startretries=999
stopsignal=TERM
stopwaitsecs=30
; Run as a dedicated unprivileged user (create with: sudo useradd -r tradeai)
user=tradeai
; Capture stdout/stderr in rotated log files separate from the bot's own bot.log
stdout_logfile=/var/log/tradeai/bot.stdout.log
stderr_logfile=/var/log/tradeai/bot.stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
; Inherit the environment from /etc/default/tradeai (set by the operator)
environment=PYTHONUNBUFFERED="1"

[program:tradeai_watchdog]
command=/usr/bin/env python3 -u scripts/watchdog.py --interval 60 --staleness 600
directory=/opt/tradeai
autostart=true
autorestart=true
startsecs=10
startretries=999
stopsignal=TERM
stopwaitsecs=10
user=tradeai
stdout_logfile=/var/log/tradeai/watchdog.stdout.log
stderr_logfile=/var/log/tradeai/watchdog.stderr.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"

[group:tradeai]
programs=tradeai_bot,tradeai_watchdog
priority=999
